<!DOCTYPE html>
<html lang="en" data-i18n-title="index.meta.title">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Inline bootstrap: sets <html lang> BEFORE first paint based on
       localStorage choice or navigator.language seed. Prevents FOUC of
       the wrong-language flag in the lang switcher. The full string
       substitution happens once i18n.js (deferred) runs at DOMContentLoaded. -->
  <script>
    (function(){
      try {
        var s = localStorage.getItem('ivanes.lang');
        if (s === 'en' || s === 'es') { document.documentElement.lang = s; return; }
      } catch (e) {}
      var b = (navigator.language || '').toLowerCase();
      if (b.indexOf('es') === 0) document.documentElement.lang = 'es';
    })();
  </script>
  <script src="assets/i18n.js" defer></script>
  <!-- Vercel Web Analytics — privacy-friendly, no cookies, GDPR-OK by default.
       /_vercel/insights/script.js is served by Vercel's edge when Web
       Analytics is enabled on the project; no asset to host locally. -->
  <script defer src="/_vercel/insights/script.js"></script>
  <title>Iván Alzamora — Madrid</title>
  <meta name="description" content="Iván Alzamora — freelancer, builder, operations at Visuanza, jewelry under Aromazla. Madrid, Spain." data-i18n-content="index.meta.description" />
  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="#0A0A0A" />

  <meta property="og:title" content="Iván Alzamora" data-i18n-content="index.meta.ogTitle" />
  <meta property="og:description" content="Builder. Operations at Visuanza. Jewelry under Aromazla. Madrid." data-i18n-content="index.meta.ogDescription" />
  <meta property="og:type" content="profile" />
  <meta property="og:url" content="https://ivan.es" />
  <meta property="og:locale" content="en_GB" />
  <link rel="canonical" href="https://ivan.es" />
  <link rel="icon" type="image/png" href="assets/aromazla-favicon.png" />
  <link rel="apple-touch-icon" href="assets/aromazla-favicon.png" />
  <link rel="stylesheet" href="assets/fonts.css" />

  <style>
    /* ─── TOKENS ─── */
    :root {
      --ink:        #0A0A0A;
      --ink-2:      #111111;
      --ink-3:      #15140F;
      --ink-card:   #18171A;
      --bone:       #FFFFFF;
      --bone-soft:  rgba(255, 255, 255, 0.88);
      --bone-faint: rgba(255, 255, 255, 0.42);
      --bone-line:  rgba(255, 255, 255, 0.10);
      --accent:       #7FA6D9;
      /* Availability reads at a glance, so it is carried by colour, not by the
         words alone: green for sale, red for not. Muted rather than signal-bright
         — these sit on a jewellery page, not a dashboard. Both clear 6.4:1 on
         the darkest ground the site uses, so the small mono type still holds. */
      --status-available: #7BD88F;
      --status-unavailable: #E8796A;
      /* One grain for the whole site — the same sprite the aromazla piece cards
         carry, so every ground is made of the same material. It rides as an
         extra background LAYER over each page's existing gradient, blended
         `screen`, so tone and gradient are untouched; only the surface is added.
         ⚠ The tile must stay SQUARE. This SVG has a viewBox and no width/height,
         so preserveAspectRatio defaults to `meet` and a non-square size
         letterboxes it, leaving ungrained bands that read as black stripes. */
      --grain: url("data:image/svg+xml,%3Csvg viewBox='0 0 280 280' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.10'/%3E%3C/svg%3E");
      /* ── THE ACCENT SITS ON TOP OF THE PAGE, NOT IN IT ──────────────────
         A highlight along the top edge and a shadow under it, so the light
         reads as coming from above-left and the mark casts downward — the
         inverse of the engraved treatment on the hero name, where the shadow
         is inside the glyph. Kept small: past about 2px of blur it stops
         looking raised and starts looking blurred.
         --accent-raise is for text, --accent-lift for SVG, which text-shadow
         cannot reach. */
      --accent-raise: 0 -1px 0 rgba(255, 255, 255, 0.16),
                      0 1px 0 rgba(0, 0, 0, 0.62),
                      0 2px 3px rgba(0, 0, 0, 0.40);
      --accent-lift: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.55));
      --accent-soft:  rgba(127, 166, 217, 0.88);

      --f-display: 'Cinzel', 'Trajan Pro', Georgia, serif;
      --f-body: 'Karla',system-ui,sans-serif;
      --f-mono:    'JetBrains Mono', ui-monospace, monospace;

      --ease-out:  cubic-bezier(0.22, 1, 0.36, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    html, body { overflow-x: hidden; }
    body {
      background: var(--ink);
      color: var(--bone);
      font-family: var(--f-body);
      font-size: 16px;
      line-height: 1.65;
      font-weight: 300;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      min-height: 100dvh;
    }
    a { color: inherit; text-decoration: none; }
    img, svg { display: block; max-width: 100%; }
    ::selection { background: var(--accent); color: var(--ink); }

    /* ─── GRAIN — fixed overlay, dithers the radial-gradient ─── */
    /* Noise is served as a static file so no inline data: URI can be mangled by
       caches, minifiers, or CSP rules between dev and the deployed site. */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 90;
      opacity: 0.05;
      background-image: url("assets/noise.svg");
      background-size: 320px 320px;
      mix-blend-mode: screen;
    }

    /* ─── STICKY STACK (mobile default) ─── */
    /* Each panel sticks at top:0 inside .stack. Increasing z-index per panel
       means each subsequent panel slides up over the previous one as you scroll.
       On desktop (≥1024px) the hero + doorway are taken out of this flow and
       laid out horizontally inside .hpanels-track — see horizontal block below. */
    .stack { display: block; }
    .stack .panel {
      position: -webkit-sticky;
      position: sticky;
      top: 0;
      min-height: 100vh;
      min-height: 100dvh;
      z-index: var(--z, 1);
      isolation: isolate;
    }
    /* Default background ensures each non-hero panel covers the panel beneath
       it during the sticky-stack. Hero keeps its own radial-glow gradient. */
    .stack .panel:not(.hero) { background: var(--ink); }
    /* On mobile, the .hpanels wrappers are layout-transparent so the two
       horizontal panels behave as direct children of .stack and stack vertically. */
    @media (max-width: 1023px) {
      .hpanels, .hpanels-track { display: contents; }
    }

    /* ─── HORIZONTAL SCROLL (desktop ≥1024px) ─── */
    @media (min-width: 1024px) {
      /* The gradient lives on the static .hpanels wrapper — it does NOT translate
         with the track. The hero name and the AROMAZLA card slide across one
         continuous canvas, like elements floating in a single section. */
      .hpanels {
        position: relative;
        width: 100%;
        height: 100vh;
        overflow: hidden;
        background:
        var(--grain),
        radial-gradient(ellipse 60% 70% at 50% 32% in oklab, rgba(50, 42, 28, 0.6) 0%, transparent 70%),
          linear-gradient(180deg in oklab, var(--ink-2) 0%, var(--ink) 100%);
      background-blend-mode: screen, normal, normal;
      background-size: 406px 406px, auto, auto;
      background-repeat: repeat, no-repeat, no-repeat;
      }
      .hpanels-track {
        display: flex;
        flex-wrap: nowrap;
        height: 100%;
        width: max-content;
        will-change: transform;
      }
      /* Both panels become transparent on desktop so the .hpanels backdrop shows
         through unbroken — no seam between hero and doorway. */
      .hpanels .hero,
      .hpanels .doorways.panel {
        background: transparent;
      }
      .hpanels .hpanel {
        position: relative !important;
        top: auto !important;
        flex: 0 0 100vw;
        width: 100vw;
        height: 100vh;
        min-height: 100vh;
        z-index: auto !important;
      }
    }

    /* ─── NAV ─── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 50;
      padding: 22px clamp(20px, 4vw, 48px);
      display: flex;
      align-items: center;
      justify-content: flex-end;
      transition: background 600ms var(--ease-out), backdrop-filter 600ms;
    }
    /* Nav stays fully transparent at all times — no background, no blur, no border on scroll */
    nav.scrolled { background: transparent; backdrop-filter: none; -webkit-backdrop-filter: none; }
    .nav-links {
      display: flex;
      align-items: center;
      gap: 36px;
      list-style: none;
    }
    .nav-links a {
      font-family: var(--f-mono);
      font-size: 0.74rem;
      font-weight: 400;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--bone-soft);
      padding: 6px 0;
      position: relative;
      transition: color 240ms var(--ease-out);
    }
    .nav-links a::after {
      content: '';
      position: absolute;
      left: 0; right: 0;
      bottom: -2px;
      height: 1px;
      background: var(--accent);
      transform: scaleX(0);
      transform-origin: left;
      transition: transform 360ms var(--ease-out);
    }
    /* The featured item is the one a visitor who came for jewellery would not
       think to look for, so its rule is always drawn rather than on hover. */
    .nav-links a.is-featured { color: var(--accent); }
    .nav-links a.is-featured::after { background: var(--accent); transform: scaleX(1); }
    .menu-sheet a.is-featured { color: var(--accent); }
    .nav-links a:hover { color: var(--bone); }
    .nav-links a:hover::after { transform: scaleX(1); }

    /* ─── MOBILE — Latin cross that morphs into X on tap. Gold in every state. ─── */
    .nav-card {
      display: none;
      width: 36px;
      height: 36px;
      cursor: pointer;
      background: transparent;
      border: 0;
      padding: 4px;
      color: var(--accent);
      filter: var(--accent-lift);
    }
    .nav-card svg {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
    }
    .nav-card line {
      stroke: currentColor;
      stroke-width: 1.6;
      stroke-linecap: round;
      transform-box: view-box;
      transform-origin: 12px 12px;
      transition: transform 420ms cubic-bezier(0.7, -0.1, 0.3, 1.1);
    }
    /* Open state → symmetric X around the icon center (12,12), arms length ~14.
       Per the spec: vertical's top point lands LEFT, bottom point lands RIGHT
       (top-left → bottom-right diagonal). Horizontal's bottom point lands LEFT,
       top point lands RIGHT (bottom-left → top-right diagonal). Both bars are
       scaled to the same length so the X is balanced.
       Order applies right-to-left:
         vertical  : scaleY(0.7) shortens 20→14, then rotate(-45deg) puts it on TL→BR.
         horizontal: scaleX(1.17) stretches 12→14, translateY(3px) drops to center,
                     rotate(-45deg) puts it on BL→TR. */
    .nav-card.open .cx-v { transform: rotate(-45deg) scaleY(0.7); }
    .nav-card.open .cx-h { transform: rotate(-45deg) translateY(3px) scaleX(1.17); }

    /* Mobile menu sheet — opens when card is flipped */
    .menu-sheet {
      position: fixed;
      inset: 0;
      z-index: 40;
      background: var(--ink);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 38px;
      padding: 96px 32px 64px;
      pointer-events: none;
      opacity: 0;
      transform: translateY(-12px);
      transition: opacity 420ms var(--ease-out), transform 540ms var(--ease-out);
    }
    .menu-sheet.open {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }
    .menu-sheet a {
      font-family: var(--f-mono);
      font-size: clamp(1.7rem, 7vw, 2.4rem);
      font-weight: 500;
      letter-spacing: 0.18em;
      color: var(--bone);
      text-transform: uppercase;
    }
    .menu-sheet a:hover { color: var(--accent); }
    /* Icon row at the bottom of the mobile menu — Instagram + WhatsApp shortcuts.
       No circle border; brand-accurate logos with their own gradient fills. */
    .menu-sheet__icons {
      display: flex;
      gap: 36px;
      margin-top: 40px;
    }
    .menu-sheet__icons a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform 240ms var(--ease-out), filter 240ms var(--ease-out);
    }
    .menu-sheet__icons a:hover {
      transform: translateY(-2px) scale(1.05);
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.45));
    }
    .menu-sheet__icons svg { width: 44px; height: 44px; }

    /* ─── LANGUAGE SWITCHER (shared block — duplicated across pages) ───
       Desktop: a flag + chevron trigger that opens a small dropdown with
       both languages; the trigger shows the CURRENT lang's flag, the
       dropdown shows BOTH. Mobile: hidden in nav, replaced by a pill row
       inside .menu-sheet (handled below). */
    .lang-switcher {
      position: relative;
      display: inline-flex;
      align-items: center;
      margin-left: 24px;
    }
    .lang-trigger {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 10px;
      background: transparent;
      border: 1px solid transparent;
      cursor: pointer;
      color: var(--bone-soft);
      border-radius: 4px;
      transition: color 240ms var(--ease-out), border-color 240ms var(--ease-out);
    }
    .lang-trigger:hover { color: var(--bone); border-color: var(--bone-line); }
    .lang-flag-svg {
      width: 22px; height: 14px;
      border-radius: 1px;
      display: block;
      flex-shrink: 0;
    }
    .lang-arrow-svg {
      width: 10px; height: 6px;
      display: block;
      transition: transform 240ms var(--ease-out);
    }
    .lang-trigger[aria-expanded="true"] .lang-arrow-svg { transform: rotate(180deg); }
    /* Show only the current language's flag on the trigger button */
    .lang-trigger .lang-flag-en, .lang-trigger .lang-flag-es { display: none; }
    html[lang="en"] .lang-trigger .lang-flag-en,
    html[lang="es"] .lang-trigger .lang-flag-es { display: block; }

    .lang-dropdown {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      min-width: 150px;
      padding: 6px;
      background: var(--ink-card);
      border: 1px solid var(--bone-line);
      border-radius: 6px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      gap: 2px;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-4px);
      transition: opacity 220ms var(--ease-out), transform 220ms var(--ease-out);
      z-index: 60;
    }
    .lang-dropdown.open {
      opacity: 1; pointer-events: auto;
      transform: translateY(0);
    }
    .lang-dropdown button {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      background: transparent;
      border: 0;
      cursor: pointer;
      font-family: var(--f-mono);
      font-size: 0.7rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--bone-soft);
      text-align: left;
      border-radius: 4px;
      transition: color 240ms var(--ease-out), background 240ms var(--ease-out);
    }
    .lang-dropdown button:hover {
      color: var(--bone);
      background: rgba(255, 255, 255, 0.04);
    }
    .lang-dropdown button[aria-current="true"] { color: var(--accent); }

    /* ─── Mobile menu-sheet language pills ─── */
    .menu-sheet__lang {
      display: flex;
      gap: 14px;
      margin-bottom: 8px;
    }
    .menu-sheet__lang button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: transparent;
      border: 1px solid var(--bone-line);
      border-radius: 9999px;
      cursor: pointer;
      font-family: var(--f-mono);
      font-size: 0.7rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--bone-soft);
      transition: color 240ms var(--ease-out), border-color 240ms var(--ease-out);
    }
    .menu-sheet__lang button[aria-current="true"] {
      color: var(--accent);
      border-color: var(--accent);
    }

    /* ─── HERO ─── */
    .hero {
      position: relative;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: clamp(120px, 18vh, 200px) 24px clamp(60px, 10vh, 120px);
      isolation: isolate;
      /* Mobile: the gradient lives on the panel itself (the wrapper has display:contents). */
      background:
        var(--grain),
        radial-gradient(ellipse 70% 65% at 50% 28% in oklab, rgba(50, 42, 28, 0.55) 0%, transparent 70%),
        linear-gradient(180deg in oklab, var(--ink-2) 0%, var(--ink) 100%);
      background-blend-mode: screen, normal, normal;
      background-size: 406px 406px, auto, auto;
      background-repeat: repeat, no-repeat, no-repeat;
    }
    /* Mobile: same backdrop on the doorway so the sticky-stack reads as one canvas */
    .doorways.panel {
      background:
        var(--grain),
        radial-gradient(ellipse 70% 65% at 50% 28% in oklab, rgba(50, 42, 28, 0.55) 0%, transparent 70%),
        linear-gradient(180deg in oklab, var(--ink-2) 0%, var(--ink) 100%);
      background-blend-mode: screen, normal, normal;
      background-size: 406px 406px, auto, auto;
      background-repeat: repeat, no-repeat, no-repeat;
    }
    /* Marble bust — left rail, looks up-right toward the name.
       Source faces left with gaze up-left, so we flip horizontally
       to redirect the gaze. The asset is a real alpha-channel cutout
       (rembg-processed WebP), so the figure floats cleanly on the page
       gradient without needing mix-blend-mode tricks. */
    .hero-statue {
      position: absolute;
      left: 0;
      bottom: 0;
      height: min(82vh, 1000px);
      width: auto;
      transform: scaleX(-1);
      /* GSAP drives this on desktop horizontal scroll for the parallax-lag
         effect. Page-coord px shift, applied via individual `translate`
         property so it composes cleanly with the scaleX(-1) flip without
         transform-order math. Mobile overrides this with its own translate
         for the optical-center fix. */
      --parallax-x: 0px;
      translate: var(--parallax-x) 0;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
      z-index: 1;
      opacity: 0;
    }
    @media (max-width: 1023px) {
      /* Mobile: bust drops out of absolute and sits in-flow below the name.
         The hero is already flex column with align-items: center, so a
         static child centers automatically. order: 2 places it after
         .hero-frame (default order 0) without needing to move the source
         markup. The horizontal flip stays so the face direction is
         consistent across breakpoints. */
      .hero-statue {
        position: static;
        order: 2;
        width: min(58vw, 280px);
        height: auto;
        margin-top: clamp(16px, 3vh, 36px);
        align-self: center;
        /* Optical-center fix: after the scaleX(-1) flip, the bust's visual
           mass sits left of the image's geometric center (the bun is
           tighter than the protruding face), so a straight-centered image
           lands the figure left of the panel midpoint. Shift the whole
           image right with the individual `translate` property — composes
           cleanly with `transform: scaleX(-1)` without fighting the
           scale's coordinate-flip. */
        translate: clamp(18px, 5vw, 36px) 0;
        /* Reset desktop anchors so the cascade is clean even though
           static positioning ignores them. */
        left: auto;
        bottom: auto;
      }
    }

    .hero-frame {
      width: 100%;
      max-width: 1100px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      /* Sits above the absolute statue so the name reads cleanly even
         where the marble overlaps the lower-left of the panel. */
      position: relative;
      z-index: 2;
    }

    /* the name plate sits at the top; large negative space below is left as canvas */
    .hero-plate {
      position: relative;
      width: 100%;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
    }

    .hero-eyebrow {
      font-family: var(--f-mono);
      font-size: 0.7rem;
      font-weight: 500;
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: var(--accent);
      display: inline-flex;
      align-items: center;
      gap: 14px;
      text-shadow: var(--accent-raise);
    }
    .hero-eyebrow::before, .hero-eyebrow::after {
      content: '';
      display: block;
      width: 22px; height: 1px;
      background: var(--accent);
    }

    .hero-name {
      /* It is an <h1> — the page's only one. It was a <div>, which left the
         document with no heading at all. Reset what the UA stylesheet adds to
         an h1 so the change is purely semantic and nothing moves. */
      margin: 0;
      font-size: inherit;
      font-weight: inherit;
      width: 100%;
      max-width: 460px;
      height: auto;
      display: block;
    }
    .hero-name svg {
      width: 100%;
      height: auto;
      overflow: visible;
    }
    .hero-name path {
      fill: var(--bone);
      fill-opacity: 0;
      stroke: var(--bone);
      stroke-width: 0.8;
      /* Pre-hidden via dash-offset so the stroke isn't visible during the
         microsecond between first paint and gsap.set() running. JS overwrites
         with the precise path length once it measures via getTotalLength(). */
      stroke-dasharray: 9999;
      stroke-dashoffset: 9999;
    }

    .hero-tagline {
      font-family: var(--f-mono);
      font-size: clamp(0.78rem, 0.95vw, 0.9rem);
      letter-spacing: 0.42em;
      text-transform: lowercase;
      font-style: italic;
      color: var(--bone-soft);
      text-align: center;
      opacity: 0;
      transform: translateY(8px);
    }

    /* ─── DOORWAYS ─── */
    .doorways {
      padding: clamp(60px, 10vw, 132px) clamp(20px, 4vw, 48px);
      background:
        var(--grain),
        radial-gradient(ellipse 70% 65% at 50% 28% in oklab, rgba(50, 42, 28, 0.55) 0%, transparent 70%),
        linear-gradient(180deg in oklab, var(--ink-2) 0%, var(--ink) 100%);
      background-blend-mode: screen, normal, normal;
      background-size: 406px 406px, auto, auto;
      background-repeat: repeat, no-repeat, no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      /* Don't let the DOM swap from <video> to <img> (LPM WebP fallback)
         trigger browser scroll-anchoring into this panel. */
      overflow-anchor: none;
    }
    .doorways * { overflow-anchor: none; }
    .doorways .door-visual {
      max-width: 1100px;
      margin: 0 auto;
    }

    /* ─── M-18 · moire-rays ──────────────────────────────────────────────────
       _library/motion/moire-rays.js. Two radial gratings of the SAME ray count
       with the second centre offset a few percent — the fringes come from the
       offset, not from differing counts (the library's own note records that
       differing counts were swept at 3/6/14/40 and produce nothing).
       Two departures from the library demo, both forced by this page:
       · LIGHT INK. The part is authored dark-on-paper; the demo page even sets
         a #d8ccae ground because on black it is ink on ink. Here the ink is
         bone at a very low alpha, so it reads as a faint sunburst rather than
         as line-work.
       · orbit: 0 — STATIC. With orbit the second centre drifts and the fringes
         breathe; at the library's own 0.03/0.05 that drift is so slow it reads
         as still anyway. Set `orbit: .03, spin: .05` on the second set to turn
         it back on. See catalogue/pages/M-18.html for it moving. */
    .hero-rays {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      z-index: 0;
      pointer-events: none;
      opacity: 0;              /* the hero timeline brings it up */
      display: block;
    }

    /* The door's place in the hero. Under 1024px it drops into the hero's own
       flex column, after the bust (which takes order: 2 there) — so order: 3.
       From 1024px it becomes the hero's right anchor, mirroring the bust on
       the left, both sitting on the same baseline. */
    /* ⚠ Written as .door-visual.hero-door, not .hero-door: `.door-visual` below
       sets width: 100% and is declared LATER, so at equal specificity it wins,
       which leaves the door anchored but stretched across the viewport. */
    .door-visual.hero-door {
      position: relative;
      order: 3;
      width: min(88vw, 420px);
      margin-top: clamp(54px, 9vh, 104px);
      z-index: 2;
    }
    @media (min-width: 1024px) {
      .door-visual.hero-door {
        position: absolute;
        right: clamp(24px, 5vw, 110px);
        bottom: clamp(20px, 5vh, 72px);
        width: clamp(300px, 34vw, 500px);
        margin-top: 0;
      }
    }
    .hero-door .door-visual-mark { width: 100%; }

    /* Frameless doorway — pendant + wordmark float on the page background.
       No card, no border, no glow rectangle, no contained box. */
    .door-visual {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      gap: clamp(18px, 2.4vw, 32px);
      background: transparent;
      border: 0;
      cursor: pointer;
      transition: transform 600ms var(--ease-out);
    }
    .door-visual-piece {
      display: block;
      /* Sized so the PENDANT — not the frame — renders at a chosen size. The
         video is cropped to the piece's union bbox across all frames, so the
         pendant is 98.6% of the frame height; the frame is very nearly the
         subject. When the framing changes, rescale these by
         (old pendant % / new pendant %) and the piece stays put. */
      height: clamp(161px, 25vh, 236px);
      width: auto;
      max-width: 90%;
      object-fit: contain;
      pointer-events: none;
      /* Mirrors the aromazla pieces card recipe — single hardcoded MP4
         (black matte) + mix-blend-mode: lighten ALWAYS on. The blend
         knocks the matte out against the panel's dark background on
         every browser. No source-picker, no .use-blend toggle — the
         JS branching version was failing to apply the blend reliably
         on iOS Safari/Edge and on some desktop Safari paths. */
      mix-blend-mode: lighten;
      transition: filter 600ms var(--ease-out), transform 600ms var(--ease-out);
    }
    /* On desktop the piece is no longer a thumbnail under a heading — it is
       the hero's right-hand subject, opposite a bust that stands 82vh tall.
       Sized to hold that side of the composition; tuned against the bust's
       measured on-screen height, not guessed. */
    @media (min-width: 1024px) {
      .door-visual-piece { height: clamp(300px, 54vh, 640px); }
    }
    /* The LPM still no longer needs sizing of its own. It is frame 0 of the
       very same file, cropped identically, so it inherits .door-visual-piece
       and lands at exactly the size the video had. The three rules that used
       to live here existed only to correct for a still framed at 96% standing
       in for a video framed at 61%. */

    /* Carved wordmark — same filter recipe as the hero name, baked-in (no animation). */
    /* Inside the hero rail the wordmark fills the rail, at every breakpoint —
       the viewport-based clamp below is the standalone default and overflows a
       rail narrower than itself. */
    .hero-door .door-visual-mark { width: 100%; }
    .door-visual-mark {
      width: clamp(300px, 64vw, 420px);
      height: auto;
      display: block;
    }
    .door-visual-mark svg { width: 100%; height: auto; overflow: visible; }
    /* The type door carries its half alone, so its wordmark runs larger than
       AROMAZLA's, which shares its panel with the piece. */
    .door-visual-mark--lg { width: clamp(340px, 52vw, 560px); }
    .door-visual--type { gap: clamp(22px, 3vw, 38px); }
    .door-visual-lede {
      margin: 0;
      max-width: 34ch;
      text-align: center;
      font-family: var(--f-body);
      font-size: clamp(1rem, 1.3vw, 1.18rem);
      line-height: 1.5;
      color: var(--bone-soft);
    }
    /* Mirrors .hero-name path exactly — same draw-on, same pre-hidden state.
       Stroke width differs only because this svg renders at a smaller scale:
       the name is 0.8 at ~0.91, so 1.3 here lands at the same hairline. */
    .door-visual-mark svg path {
      fill: var(--bone);
      fill-opacity: 0;
      stroke: var(--bone);
      stroke-width: 1.3;
      stroke-dasharray: 9999;
      stroke-dashoffset: 9999;
    }
    /* Hidden until the hero timeline brings them in — same reasoning as
       .hero-statue's opacity: 0. The timeline's reduced-motion branch sets the
       final state, so nothing is left invisible if the animation never runs. */
    .door-visual-piece, .door-visual-cue { opacity: 0; }

    /* Clickability cue — tells visitors the pendant is a door, not just an image. */
    .door-visual-cue {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-top: 4px;
      font-family: var(--f-mono);
      font-size: 0.7rem;
      letter-spacing: 0.42em;
      text-transform: uppercase;
      color: var(--accent-soft);
      text-shadow: var(--accent-raise);
      font-weight: 500;
    }
    .door-visual-cue::before {
      content: '';
      width: 26px; height: 1px;
      background: var(--accent-soft);
    }
    .door-visual-cue .glyph { display: inline-block; }

    /* ─── REVEAL ─── */
    .reveal {
      opacity: 0;
      transform: translateY(14px);
      transition: opacity 900ms var(--ease-out), transform 900ms var(--ease-out);
    }
    .reveal.visible { opacity: 1; transform: translateY(0); }

    /* ─── RESPONSIVE ─── */
    @media (max-width: 768px) {
      .nav-links { display: none; }
      .nav-card { display: inline-flex; }
      .lang-switcher { display: none; }
    }
    @media (max-width: 540px) {
      .hero { padding: 96px 18px 90px; }
      .hero-plate { padding: 28px 12px; }
      .hero-frame { gap: 32px; }
      .door { min-height: 320px; padding: 32px 26px; }
    }

    /* ─── FOCUS ─── */
    a:focus-visible, button:focus-visible {
      outline: 1px solid var(--accent);
      outline-offset: 4px;
    }

    /* ─── REDUCED MOTION ─── */
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
      .reveal { opacity: 1; transform: none; }
      .hero-name path { fill-opacity: 1; }
    }
  
      /* ─── the Aromazla mark dissolving into the marble it was traced from ──
         No WebGL. The logo is a second <img> stacked on the statue with the
         SAME class, so it inherits every rule the statue has — position, size,
         the scaleX(-1) flip, the GSAP parallax — and can never drift out of
         register. A tileable fbm mask cuts the openings; sliding
         mask-position animates it on the compositor, no per-frame JS.
         ⚠ The two files share one 1011x1300 canvas and agree to 94.6% IoU,
         which is why the fog opens INSIDE one outline rather than between two. */
      /* the mark <img> is only the SOURCE — mark-fog.js draws it into a
         canvas and erases the fog through it, so the vapour lives inside the
         silhouette and never touches the surroundings.
         ⚠ IT MUST NOT BE LAID OUT. It first carried .hero-statue so it would
         inherit the bust's position, size and flip for free — which works
         only while that class is absolute. Under 1024px .hero-statue turns
         static with order:2, so a second element carrying it became a second
         in-flow item and the mark landed BELOW the bust instead of on it.
         Registration now comes from measuring the bust itself, which is
         exact at every width because both assets are the same 1011x1300
         frame. Kept in the document (not created in JS) so the fetch starts
         with the markup; 1px and invisible so it can never affect layout. */
      .hero-mark-src{position:absolute;left:0;top:0;width:1px;height:1px;
        opacity:0;pointer-events:none;visibility:hidden}
      /* ⚠ z-index 2: .hero-statue is z-index 1, so a canvas at auto paints
         UNDER the bust and is invisible however correct its contents are */
      .markfog{position:absolute;pointer-events:none;z-index:2}
      /* ─── LEGAL STRIP ───────────────────────────────────────────────────────
       Thin, fixed to the bottom, on every page. LSSI art. 10 wants the legal
       notice reachable from anywhere, and the panel layout here has no footer to
       hang it on — several pages are pinned 100vh tracks, so appending a footer
       would either add scroll or sit inside a pinned panel. Fixed avoids both and
       costs the index nothing, which has to stay one screen.
       Deliberately quiet: this is a legal obligation, not a navigation item. */
    .legal-strip {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 7px 16px;
      font-family: var(--f-mono);
      font-size: 9.5px;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: rgba(255,255,255,.34);
      background: linear-gradient(180deg, transparent, rgba(0,0,0,.45) 60%);
      pointer-events: none;
    }
    .legal-strip a, .legal-strip span { pointer-events: auto; }
    .legal-strip a { color: inherit; text-decoration: none; transition: color 240ms var(--ease-out); }
    .legal-strip a:hover { color: var(--accent); }
    .legal-strip i { font-style: normal; opacity: .4; }
    @media (max-width: 560px) { .legal-strip { gap: 12px; font-size: 8.6px; letter-spacing: .12em; } }
  </style>
</head>

       The .hpanels container holds the two horizontal panels (hero + doorway).

  <main class="stack">

  <!-- HERO -->
  <section class="hero panel hpanel" id="hero" style="--z:1;">
    <!-- Marble bust on the left rail. Decorative, hidden from AT.
         WebP cutout (~115 KB, 1011×1300, alpha-channel). decoding=async
         + fetchpriority=low so the name SVG (the actual hero subject)
         strokes in without waiting on the image fetch. -->
    <img class="hero-statue" id="heroStatue"
         src="assets/mm-cutout.webp" alt="" aria-hidden="true"
         decoding="async" fetchpriority="low" />
    <!-- the brand mark. Texture source only — never laid out, never visible;
         mark-fog.js reads it and registers the canvas to the bust above. -->
    <img class="hero-mark-src" id="heroMark"
         src="assets/aromazla-logo-aligned.webp" alt="" aria-hidden="true"
         decoding="async" fetchpriority="low" />
    <div class="hero-frame">
      <div class="hero-plate">
        <h1 class="hero-name" aria-label="Ivan Alzamora">
          <svg viewBox="-20 -10 504 175" preserveAspectRatio="xMidYMid meet" role="img" aria-hidden="true">
            <defs>
              <!-- Carved-into-stone filter: dark inner shadow on top-left + soft light edge on bottom-right.
                   Flood-opacities start at 0 so the filter is a no-op until phase 3 of the timeline. -->
              <filter id="carved" x="-10%" y="-10%" width="120%" height="120%">
                <feFlood id="carveShadowFlood" flood-color="#000000" flood-opacity="0" result="sFlood"/>
                <feComposite in="sFlood" in2="SourceAlpha" operator="out" result="sOut"/>
                <feOffset in="sOut" dx="1.4" dy="1.8" result="sOff"/>
                <feGaussianBlur in="sOff" stdDeviation="1.2" result="sBlur"/>
                <feComposite in="sBlur" in2="SourceAlpha" operator="in" result="shadow"/>

                <feFlood id="carveLightFlood" flood-color="#FFFFFF" flood-opacity="0" result="lFlood"/>
                <feComposite in="lFlood" in2="SourceAlpha" operator="out" result="lOut"/>
                <feOffset in="lOut" dx="-1.0" dy="-1.3" result="lOff"/>
                <feGaussianBlur in="lOff" stdDeviation="0.85" result="lBlur"/>
                <feComposite in="lBlur" in2="SourceAlpha" operator="in" result="light"/>

                <feMerge>

          const r = doorVideo.getBoundingClientRect();
          const insideVideo = e.clientX >= r.left && e.clientX <= r.right
                           && e.clientY >= r.top  && e.clientY <= r.bottom;
          if (insideVideo) {
            e.preventDefault();
            e.stopPropagation();
            doorVideo.play().catch(() => swapToWebpFallback());
          }
        });
      }
    }

    // ─── Card-flip mobile nav ───
    const card = document.getElementById('navCard');
    const sheet = document.getElementById('menuSheet');
    const setOpen = (open) => {
      card.classList.toggle('open', open);
      sheet.classList.toggle('open', open);
      card.setAttribute('aria-expanded', open ? 'true' : 'false');
      sheet.setAttribute('aria-hidden', open ? 'false' : 'true');
      document.body.style.overflow = open ? 'hidden' : '';
    };
    card.addEventListener('click', () => setOpen(!card.classList.contains('open')));
    sheet.querySelectorAll('a').forEach((a) => a.addEventListener('click', () => setOpen(false)));
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && card.classList.contains('open')) setOpen(false);
    });

    // ─── Reveals ───
    const obs = new IntersectionObserver((entries) => {
      entries.forEach((e) => {
        if (e.isIntersecting) {
          e.target.classList.add('visible');
          obs.unobserve(e.target);
        }
      });
    }, { threshold: 0.18, rootMargin: '0px 0px -8% 0px' });
    document.querySelectorAll('.reveal').forEach((el) => obs.observe(el));

    // ─── HERO: GSAP path-draw ───
    // Strategy: per <path> measure pathLength, set strokeDasharray/Offset, animate to 0 over 4s,
    // then fill-opacity 0→1 over 1.5s. The single SVG path here contains all glyphs as subpaths;
    // the browser treats getTotalLength() across the whole d, which still yields a valid draw.
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const path = document.getElementById('namePath');
    const tagline = document.querySelector('.hero-tagline');
    const heroStatue = document.getElementById('heroStatue');
    const doorPiece = document.getElementById('doorVideo');
    const doorMark = document.getElementById('doorMarkPath');
    const doorCue = document.querySelector('.door-visual-cue');
    /* the brand mark is a second layer of the same object — every tween that
       touches the statue must touch it too, or the two drift apart */
    /* the fog canvas reads the bust's own computed opacity every frame, so
       the mark is not part of these tweens any more */
    if (path && !reduce) {
      const len = path.getTotalLength();
      gsap.set(path, {
        strokeDasharray: len,
        strokeDashoffset: len,
        fillOpacity: 0,
        strokeOpacity: 1
      });
      const shadowFlood = document.getElementById('carveShadowFlood');
      const lightFlood = document.getElementById('carveLightFlood');

      const tl = gsap.timeline();
      // Statue materialises slowly through the entire name reveal —
      //    starts before the name fill (T=0.4, just after the stroke
      //    begins) and extends well past the carving so the marble feels
      //    like it's rising from the page's depth, not arriving on a beat.
      //    Long duration (4.0s) makes the fade barely perceptible per
      //    frame; viewers register the figure becoming present rather
      //    than appearing. Caps at 0.88 so the marble keeps a faint
      //    distance from the page surface (full opacity would compete
      //    with the name for foreground attention).
      if (heroStatue) {
        tl.to(heroStatue, { opacity: 0.88, duration: 4.0, ease: 'sine.out' }, 0.4);
      }
      // 1. Draw the stroke (same 4s pace as before).
      tl.to(path, { strokeDashoffset: 0, duration: 4, ease: 'power1.inOut' }, 0.6);
      // 2. Fill catches the draw early — starts 3.4s before the stroke completes.
      //    Stroke crossfades down across the same window so the two states dissolve into one.
      tl.to(path, { fillOpacity: 1, duration: 1.6, ease: 'sine.inOut' }, '-=3.4');
      tl.to(path, { strokeOpacity: 0, duration: 1.6, ease: 'sine.inOut' }, '<');
      if (tagline) {
        tl.to(tagline, { opacity: 1, y: 0, duration: 1.2, ease: 'sine.out' }, '<');
      }
      // 3. Carve catches the tail of phase 2 — starts ~2.8s earlier than its previous beat
      //    so the recess feels like a domino chasing the fill. Same smoothness (sine.inOut).
      //    Floods rise + fill darkens to #FFFFFF over the same 1.0s window.
      tl.to(path, { fill: '#FFFFFF', duration: 1.0, ease: 'sine.inOut' }, '-=2.6');
      tl.to(shadowFlood, { attr: { 'flood-opacity': 0.92 }, duration: 1.0, ease: 'sine.inOut' }, '<');
      tl.to(lightFlood, { attr: { 'flood-opacity': 0.42 }, duration: 1.0, ease: 'sine.inOut' }, '<');

      // ── THE DOOR, on the name's own beats ──
      // Positions are ABSOLUTE, not relative. The tweens above use '-=' and
      // '<', which resolve against the timeline's end AS IT STANDS when each is
      // added — so appending anything with a relative position would land it
      // somewhere unintended. The name's beats work out to: draw 0.6-4.6,
      // fill 1.2-2.8, carve 2.0-3.0, and the bust fades 0.4-4.4. The door
      // reuses those numbers so the two headings are written together and the
      // piece materialises exactly as the marble does.
      if (doorPiece) {
        tl.to(doorPiece, { opacity: 1, duration: 4.0, ease: 'sine.out' }, 0.4);
        // The turn starts at 2.4s — partway through the 0.4-4.4s fade, not after
        // it. Waiting for the fade to finish left the piece sitting still for too
        // long; starting it while the marble is still coming up means the two
        // arrive together instead of in sequence.
        tl.add(releaseDoor, 2.4);
      }
      if (doorMark) {
        const dlen = doorMark.getTotalLength();
        gsap.set(doorMark, { strokeDasharray: dlen, strokeDashoffset: dlen, fillOpacity: 0, strokeOpacity: 1 });
        const doorShadow = document.getElementById('doorShadowFlood');
        const doorLight = document.getElementById('doorLightFlood');
        tl.to(doorMark, { strokeDashoffset: 0, duration: 4, ease: 'power1.inOut' }, 0.6);
        tl.to(doorMark, { fillOpacity: 1, duration: 1.6, ease: 'sine.inOut' }, 1.2);
        tl.to(doorMark, { strokeOpacity: 0, duration: 1.6, ease: 'sine.inOut' }, 1.2);
        tl.to(doorMark, { fill: '#FFFFFF', duration: 1.0, ease: 'sine.inOut' }, 2.0);
        tl.to(doorShadow, { attr: { 'flood-opacity': 0.92 }, duration: 1.0, ease: 'sine.inOut' }, 2.0);
        tl.to(doorLight, { attr: { 'flood-opacity': 0.42 }, duration: 1.0, ease: 'sine.inOut' }, 2.0);
      }
      if (doorCue) tl.to(doorCue, { opacity: 1, duration: 1.2, ease: 'sine.out' }, 1.2);
      // The rays settle last and slowest — they are ground, so they should be
      // noticed after the name rather than arriving with it.
      const heroRays = document.getElementById('heroRays');
      if (heroRays) tl.to(heroRays, { opacity: 1, duration: 2.6, ease: 'sine.out' }, 2.2);
    } else {
      if (path) {
        path.style.fillOpacity = 1;
        path.style.fill = '#FFFFFF';
      }
      const sf = document.getElementById('carveShadowFlood');
      const lf = document.getElementById('carveLightFlood');
      if (sf) sf.setAttribute('flood-opacity', '0.92');
      if (lf) lf.setAttribute('flood-opacity', '0.42');
      if (tagline) { tagline.style.opacity = 1; tagline.style.transform = 'none'; }
      if (heroStatue) { heroStatue.style.opacity = '0.88'; }
      if (doorPiece) doorPiece.style.opacity = '1';
      if (doorCue) doorCue.style.opacity = '1';
      const hr = document.getElementById('heroRays');
      if (hr) hr.style.opacity = '1';
      if (doorMark) {
        doorMark.style.strokeDashoffset = '0';
        doorMark.style.fillOpacity = '1';
        doorMark.style.fill = '#FFFFFF';
        doorMark.style.strokeOpacity = '0';
        const ds = document.getElementById('doorShadowFlood');
        const dl = document.getElementById('doorLightFlood');
        if (ds) ds.setAttribute('flood-opacity', '0.92');
        if (dl) dl.setAttribute('flood-opacity', '0.42');
      }
      releaseDoor();
    }

    // ─── Horizontal scroll (desktop only) ───
    // The .hpanels block contains two 100vw panels. On ≥1024px, ScrollTrigger pins
    // the wrapper and scrubs the track on the x-axis as the user scrolls vertically.
    // Once the pin distance is consumed, the pin releases and the footer scrolls
    // up normally — no jarring jump because the wrapper holds 100vh of space and
    // the pin's natural release returns control to the document flow.
    if (window.gsap && window.ScrollTrigger) {
      gsap.registerPlugin(ScrollTrigger);
      const mm = gsap.matchMedia();
      mm.add('(min-width: 1024px)', () => {
        const track = document.getElementById('hpanelsTrack');
        const wrapper = document.getElementById('hpanels');
        if (!track || !wrapper) return;
        const panels = track.querySelectorAll('.hpanel');
        const slides = panels.length;
        // The doorway was folded into the hero, so there is normally exactly
        // one panel and nothing to scrub. Pinning with a zero-length distance
        // leaves ScrollTrigger holding the viewport for 0px, which reads as a
        // stutter at the top of the page. Bail out and let the hero behave as
        // an ordinary full-height section. Restores itself if a panel is added.
        if (slides < 2) return;
        const distance = () => (slides - 1) * window.innerWidth;
        const tween = gsap.to(track, {
          x: () => -distance(),
          ease: 'none',
          scrollTrigger: {
            trigger: wrapper,
            start: 'top top',
            end: () => '+=' + distance(),
            pin: true,
            scrub: 0.4,
            anticipatePin: 1,
            invalidateOnRefresh: true,
          },
        });

        // Bust parallax — counter-translates the bust by ~15% of the track's
        // horizontal scroll distance so the figure appears to lag behind
        // the panel, reading as a heavier object sitting deeper in space.
        // Tied to the same scroll progress as the main horizontal tween
        // (same trigger, same start/end, same scrub) so they stay in lockstep
        // even on resize/refresh. Drives the `--parallax-x` CSS variable
        // which feeds the bust's `translate` property — composes cleanly
        // with the scaleX(-1) flip already on the element.
        const statue = document.querySelectorAll('.hero-statue');
        let statueParallax = null;
        if (statue.length) {
          const lag = () => Math.round(window.innerWidth * 0.15);
          statueParallax = gsap.fromTo(statue,
            { '--parallax-x': '0px' },
            {
              '--parallax-x': () => lag() + 'px',
              ease: 'none',
              scrollTrigger: {
                trigger: wrapper,
                start: 'top top',
                end: () => '+=' + distance(),
                scrub: 0.4,
                invalidateOnRefresh: true,
              },
            }
          );
        }

        return () => {
          tween.scrollTrigger && tween.scrollTrigger.kill();
          tween.kill();
          if (statueParallax) {
            statueParallax.scrollTrigger && statueParallax.scrollTrigger.kill();
            statueParallax.kill();
          }
        };
      });
    }
  </script>
<script src="assets/mark-fog.js"></script>
<script type="module">
  /* M-18 · moire-rays. These numbers were chosen by Ivan in the catalogue's own
     M-18 page (Animated + On black), so they are his, not defaults:
       spin .14   — ANIMATED, ~3x the library's .05. The second centre goes round
                    in tens of seconds rather than minutes, so the fringes
                    visibly breathe instead of appearing frozen.
       orbit .03  — the library's own ceiling. Past ~.04 the two convergence
                    points separate far enough to read as two dark blemishes.
       270 rays   — spacing at a given radius is 2*pi*R/count; the far corner of
                    a 1440x900 canvas sits at R~890, so this is ~21px apart. At
                    130 you see individual diagonals instead of a field.
       alpha .032 — under a fifth of the library's .17. Held right back so the
                    rays are felt rather than seen; at .055 they still read as
                    line-work. This is the dial to touch first, before count.
       core .34   — the erased centre, widened so the convergence does not
                    gather behind the wordmark.
     Desktop only, and the part stops itself off-screen and under
     prefers-reduced-motion. */
  import { moireRays } from './assets/moire-rays.js';
  const c = document.getElementById('heroRays');
  if (c && window.matchMedia('(min-width: 1024px)').matches) {
    moireRays(c, {
      ink: '#FFFFFF',
      sets: [
        { count: 270, alpha: .032, width: 1 },
        { count: 270, alpha: .032, width: 1, orbit: .03, spin: .14 },
      ],
      origin: [.5, .46],
      core: .34,
    });
  }
</script>
